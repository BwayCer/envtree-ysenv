---
cntrCommand: podman
palletBoxs:
  share:
    volume:
      - ~/ys/envfile/pub/share/.bash_profile:~/.bash_profile
      - ~/ys/envfile/pub/share/.bashrc:~/.bashrc
      - ~/ys/envfile/pub/share/.bashrc_aaa0_env:~/.bashrc_aaa0_env
      - ~/ys/envfile/pub/share/.gitconfig:~/.gitconfig
      - ~/ys/envfile/pub/share/.local/bin/PS777:~/.local/bin/PS777
      - ~/ys/envfile/pub/share/.local/share/bash-completion/completions/git.bash:~/.local/share/bash-completion/completions/git.bash
  shareBway:
    volume:
      # nvim
      # - ~/ys/_mntfile/repo__bway.vim:~/ys/_mntfile/repo__bway.vim
      # tmux_mo
      - ~/ys/envfile/pub/share/.local/bin/tmux_mo:~/.local/bin/tmux_mo
      - ~/ys/envfile/pub/share/.local/share/bash-completion/completions/tmux_mo.bash:~/.local/share/bash-completion/completions/tmux_mo.bash
      - ~/ys/envfile/pub/share/.local/state/tmux_mo:~/.local/state/tmux_mo
    # rc:
      # nvim
      # - '[[ -d ~/.config/nvim || -f ~/.vimrc ]] || ~/ys/_mntfile/repo__bway.vim/init.sh'
  pokemon:
    volume:
      - ~/ys/envfile_priv/.bashrc_pokemon:~/.bashrc_pokemon
      - ~/ys/envfile_priv/.ssh:~/.ssh
hosts:
  tty:
    palletBoxs:
      - share
      - shareBway
      - pokemon
cntrs:
  tty:
...
